<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学习助手</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --sidebar: #fafbfe;
    --text: #1f2329;
    --muted: #8b909a;
    --line: #ebedf3;
    --accent: #4d6bfe;
    --accent-2: #7c5cff;
    --accent-soft: #eef1ff;
    --danger: #e05b5b;
    --shadow: 0 10px 30px rgba(31, 45, 90, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 18px 14px;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    color: #fff; font-size: 17px; font-weight: 700;
    box-shadow: 0 6px 16px rgba(77, 107, 254, 0.28);
  }
  .brand-text { font-weight: 650; font-size: 15px; letter-spacing: .3px; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 11px 12px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 20px rgba(77, 107, 254, 0.24);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .new-chat:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(77, 107, 254, 0.32); }
  .new-chat:active { transform: translateY(0); }

  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .6px;
    color: var(--muted); padding: 4px 8px 0;
  }
  .session-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .session-item {
    position: relative;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 10px; border-radius: 11px;
    color: #4b5160; font-size: 13.5px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .session-item:hover { background: #eef0f6; }
  .session-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .session-item .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #c9cddb; flex-shrink: 0;
  }
  .session-item.active .dot { background: var(--accent); }
  .session-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .del-btn {
    opacity: 0; width: 24px; height: 24px; border: none; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer; font-size: 15px;
    display: grid; place-items: center; transition: all .15s ease;
  }
  .session-item:hover .del-btn { opacity: 1; }
  .del-btn:hover { background: #ffe9e9; color: var(--danger); }
  .empty-tip { color: var(--muted); font-size: 12.5px; padding: 10px; line-height: 1.7; }

  .sidebar-footer {
    border-top: 1px solid var(--line); padding-top: 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #37c07a;
    box-shadow: 0 0 0 3px rgba(55, 192, 122, .16);
  }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 26px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.86); backdrop-filter: blur(8px);
  }
  .topbar h1 { font-size: 15.5px; margin: 0; font-weight: 650; }
  .topbar p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .badge {
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 6px 12px; font-weight: 600;
  }

  .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-inner { max-width: 820px; margin: 0 auto; padding: 28px 26px 20px; }

  .welcome { padding: 34px 6px 10px; }
  .welcome-logo {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-size: 25px; font-weight: 700;
    box-shadow: 0 12px 28px rgba(77, 107, 254, .26);
  }
  .welcome h2 { font-size: 24px; margin: 18px 0 8px; letter-spacing: .2px; }
  .welcome .lead { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; }
  .suggest {
    text-align: left; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 13.5px; color: #444b59; cursor: pointer; line-height: 1.6;
    transition: all .16s ease;
  }
  .suggest span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .suggest:hover {
    border-color: #cfd8ff; background: #fbfcff; transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(31, 45, 90, .07);
  }

  .msg { display: flex; gap: 12px; margin: 22px 0; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .avatar.me { background: linear-gradient(135deg, #9aa4b8, #6f7a90); }
  .bubble {
    max-width: 74%; padding: 13px 16px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble {
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(31, 45, 90, .04);
    border-top-left-radius: 5px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-top-right-radius: 5px;
    box-shadow: 0 8px 20px rgba(77, 107, 254, .22);
  }
  .bubble.error { background: #fff3f3; border: 1px solid #f7d4d4; color: var(--danger); }
  .bubble code {
    font-family: "Cascadia Code", Consolas, monospace;
    background: #f2f4f8; border-radius: 5px; padding: 1px 5px; font-size: 13px;
  }
  .msg.user .bubble code { background: rgba(255,255,255,.2); color: #fff; }
  .bubble pre {
    background: #1e2230; color: #e8ecf5; border-radius: 10px;
    padding: 13px 15px; overflow-x: auto; font-size: 12.8px; line-height: 1.6;
    margin: 10px 0 4px;
  }
  .bubble pre code { background: none; padding: 0; color: inherit; }
  .cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); border-radius: 2px; vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .thinking { display: inline-flex; gap: 5px; padding: 3px 0; }
  .thinking i {
    width: 6px; height: 6px; border-radius: 50%; background: #b9c0d4;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .thinking i:nth-child(2) { animation-delay: .15s; }
  .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ---------- 输入区 ---------- */
  .composer-wrap { padding: 8px 26px 20px; background: linear-gradient(180deg, rgba(245,246,250,0), var(--bg) 26%); }
  .composer {
    max-width: 820px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); padding: 12px 12px 10px 18px;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .composer:focus-within { border-color: #c4cfff; box-shadow: 0 12px 32px rgba(77, 107, 254, .14); }
  .composer textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 14.5px; line-height: 1.6; color: var(--text);
    background: transparent; max-height: 168px; padding: 2px 0 6px;
  }
  .composer textarea::placeholder { color: #a6abb8; }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; }
  .hint { font-size: 11.5px; color: var(--muted); }
  .send-btn {
    width: 38px; height: 38px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 16px rgba(77, 107, 254, .28);
    transition: transform .15s ease, opacity .15s ease;
  }
  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .send-btn.stop { background: linear-gradient(135deg, #8f97a8, #6c7488); box-shadow: none; }

  .mobile-toggle { display: none; }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%);
      transition: transform .2s ease; box-shadow: 0 0 40px rgba(20, 25, 40, .12);
    }
    .sidebar.open { transform: none; }
    .mobile-toggle {
      display: grid; place-items: center; width: 34px; height: 34px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      color: var(--text); cursor: pointer; margin-right: 10px; font-size: 16px;
    }
    .topbar { padding: 12px 16px; }
    .chat-inner { padding: 18px 16px; }
    .composer-wrap { padding: 6px 14px 14px; }
    .suggestions { grid-template-columns: 1fr; }
    .bubble { max-width: 86%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">学</div>
      <div>
        <div class="brand-text">学习助手</div>
        <div class="brand-sub">基于大模型的对话与单词讲解</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <div class="section-label">最近会话</div>
    <div class="session-list" id="sessionList">
      <div class="empty-tip">还没有会话，发一句话就开始吧。</div>
    </div>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span>服务运行中 · 流式输出</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;">
        <button class="mobile-toggle" id="mobileToggle" aria-label="会话列表">☰</button>
        <div>
          <h1 id="chatTitle">新对话</h1>
          <p id="chatSub">支持多轮上下文，Enter 发送</p>
        </div>
      </div>
      <span class="badge">在线对话</span>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <section class="welcome" id="welcome">
          <div class="welcome-logo">学</div>
          <h2>今天想学点什么？</h2>
          <p class="lead">我可以陪你连续对话，也能拆解英文单词。试试下面的问题，或直接在下方输入。</p>
          <div class="suggestions">
            <button class="suggest" data-q="用通俗的话解释一下 Python 装饰器，并给一个例子">解释 Python 装饰器<span>概念 + 可运行示例</span></button>
            <button class="suggest" data-q="帮我讲解单词 serendipity，包括音标、词性、释义和例句">讲解单词 serendipity<span>音标 / 词性 / 例句</span></button>
            <button class="suggest" data-q="快速排序的原理是什么？请给出 Python 实现并说明时间复杂度">快速排序原理<span>算法 + 代码</span></button>
            <button class="suggest" data-q="帮我制定一个两周的 Python 入门学习计划，每天 1 小时">两周学习计划<span>按天拆解任务</span></button>
          </div>
        </section>
        <div id="messages"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
        <div class="composer-bar">
          <span class="hint" id="hint">Enter 发送 · Shift + Enter 换行</span>
          <button class="send-btn" id="sendBtn" aria-label="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const listEl = $("sessionList");
const messagesEl = $("messages");
const scrollEl = $("chatScroll");
const inputEl = $("input");
const sendBtn = $("sendBtn");
const welcomeEl = $("welcome");
const titleEl = $("chatTitle");

const TITLES_KEY = "chat.session.titles";
const CURRENT_KEY = "chat.current.id";

let currentId = localStorage.getItem(CURRENT_KEY) || newChatId();
let streaming = false;
let controller = null;
let titles = loadTitles();

function loadTitles() {
  try { return JSON.parse(localStorage.getItem(TITLES_KEY) || "{}"); } catch { return {}; }
}
function saveTitles() {
  localStorage.setItem(TITLES_KEY, JSON.stringify(titles));
}
function newChatId() {
  return "web-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}
function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* 轻量渲染：代码块、行内代码、粗体，其余按纯文本换行显示 */
function renderRich(text) {
  const parts = text.split(/```/);
  let html = "";
  parts.forEach((part, index) => {
    if (index % 2 === 1) {
      const code = part.replace(/^\n/, "").replace(/\n$/, "");
      html += "<pre><code>" + escapeHtml(code) + "</code></pre>";
    } else {
      let safe = escapeHtml(part);
      safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      html += safe;
    }
  });
  return html;
}

function isNearBottom() {
  return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 90;
}
function scrollToBottom(force = false) {
  if (force || isNearBottom()) {
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }
}

function addMessage(role, text, options = {}) {
  welcomeEl.style.display = "none";
  const row = document.createElement("div");
  row.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar" + (role === "user" ? " me" : "");
  avatar.textContent = role === "user" ? "我" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (options.error ? " error" : "");
  bubble.innerHTML = options.thinking
    ? '<span class="thinking"><i></i><i></i><i></i></span>'
    : renderRich(text);
  if (role === "user") {
    row.appendChild(bubble);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(bubble);
  }
  messagesEl.appendChild(row);
  scrollToBottom(true);
  return bubble;
}

function setStreamingUI(on) {
  streaming = on;
  sendBtn.classList.toggle("stop", on);
  sendBtn.disabled = false;
  sendBtn.innerHTML = on
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>';
  $("hint").textContent = on ? "正在生成，点击方块可停止" : "Enter 发送 · Shift + Enter 换行";
}

async function refreshSessions(selectId) {
  try {
    const res = await fetch("/sessions");
    if (!res.ok) return;
    const data = await res.json();
    renderSessions(data.sessions || [], selectId);
  } catch { /* 网络异常时保持现状 */ }
}

function sessionTitle(id) {
  return titles[id] || "会话 " + id.slice(-4);
}

function renderSessions(ids, selectId) {
  const sorted = [...ids].sort((a, b) => {
    const ta = titles[a] ? 1 : 0;
    return ta - (titles[b] ? 1 : 0);
  });
  listEl.innerHTML = "";
  if (!sorted.length) {
    listEl.innerHTML = '<div class="empty-tip">还没有会话，发一句话就开始吧。</div>';
    return;
  }
  sorted.forEach((id) => {
    const item = document.createElement("div");
    item.className = "session-item" + (id === (selectId || currentId) ? " active" : "");
    item.innerHTML = '<span class="dot"></span><span class="session-name">' + escapeHtml(sessionTitle(id)) + '</span>';
    const del = document.createElement("button");
    del.className = "del-btn";
    del.title = "删除会话";
    del.textContent = "×";
    del.addEventListener("click", (event) => {
      event.stopPropagation();
      deleteSession(id);
    });
    item.appendChild(del);
    item.addEventListener("click", () => openSession(id));
    listEl.appendChild(item);
  });
}

async function openSession(id) {
  if (streaming) return;
  currentId = id;
  localStorage.setItem(CURRENT_KEY, id);
  messagesEl.innerHTML = "";
  welcomeEl.style.display = "none";
  try {
    const res = await fetch("/sessions/" + encodeURIComponent(id) + "/messages");
    if (!res.ok) throw new Error("会话不存在");
    const data = await res.json();
    (data.messages || []).forEach((m) => addMessage(m.role === "user" ? "user" : "assistant", m.content));
    titleEl.textContent = sessionTitle(id);
    refreshSessions(id);
  } catch {
    newChat();
  }
  $("sidebar").classList.remove("open");
}

function newChat() {
  if (streaming) return;
  currentId = newChatId();
  localStorage.setItem(CURRENT_KEY, currentId);
  messagesEl.innerHTML = "";
  welcomeEl.style.display = "";
  titleEl.textContent = "新对话";
  refreshSessions();
  inputEl.focus();
  $("sidebar").classList.remove("open");
}

async function deleteSession(id) {
  try {
    const res = await fetch("/sessions/" + encodeURIComponent(id), { method: "DELETE" });
    if (res.status !== 204 && res.status !== 404) throw new Error("删除失败");
  } catch { /* 忽略 */ }
  delete titles[id];
  saveTitles();
  if (id === currentId) {
    newChat();
  } else {
    refreshSessions();
  }
}

async function send() {
  if (streaming) {
    if (controller) controller.abort();
    return;
  }
  const text = inputEl.value.trim();
  if (!text) return;

  if (!titles[currentId]) {
    titles[currentId] = text.length > 22 ? text.slice(0, 22) + "…" : text;
    saveTitles();
  }
  titleEl.textContent = sessionTitle(currentId);

  inputEl.value = "";
  autoGrow();
  addMessage("user", text);
  const bubble = addMessage("assistant", "", { thinking: true });

  controller = new AbortController();
  setStreamingUI(true);

  let answer = "";
  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: currentId, message: text }),
      signal: controller.signal,
    });
    if (!res.ok) {
      let detail = "HTTP " + res.status;
      try {
        const data = await res.json();
        if (data && data.detail) detail = data.detail;
      } catch { /* 非 JSON 响应 */ }
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += decoder.decode(value, { stream: true });
      bubble.innerHTML = renderRich(answer) + '<span class="cursor"></span>';
      scrollToBottom();
    }
    if (!answer) {
      bubble.innerHTML = '<span style="color:#8b909a">（模型没有返回内容）</span>';
    } else {
      bubble.innerHTML = renderRich(answer);
    }
  } catch (err) {
    if (err.name === "AbortError") {
      bubble.innerHTML = renderRich(answer) || '<span style="color:#8b909a">已停止生成</span>';
      if (answer) bubble.innerHTML = renderRich(answer) + '<div style="color:#8b909a;font-size:12px;margin-top:6px">（已手动停止）</div>';
    } else {
      bubble.className = "bubble error";
      bubble.textContent = "请求失败：" + err.message;
    }
  } finally {
    setStreamingUI(false);
    controller = null;
    refreshSessions(currentId);
    scrollToBottom();
  }
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 168) + "px";
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
$("newChat").addEventListener("click", newChat);
$("mobileToggle").addEventListener("click", () => $("sidebar").classList.toggle("open"));
document.querySelectorAll(".suggest").forEach((btn) => {
  btn.addEventListener("click", () => {
    inputEl.value = btn.dataset.q;
    autoGrow();
    send();
  });
});

/* 首屏：恢复上次会话或展示欢迎页 */
(async function init() {
  await refreshSessions();
  const saved = localStorage.getItem(CURRENT_KEY);
  if (saved) {
    try {
      const res = await fetch("/sessions/" + encodeURIComponent(saved) + "/messages");
      if (res.ok) {
        const data = await res.json();
        if ((data.messages || []).length) {
          currentId = saved;
          openSession(saved);
          return;
        }
      }
    } catch { /* 回退到新对话 */ }
  }
  newChat();
  welcomeEl.style.display = "";
})();
</script>
</body>
</html>
